<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>MaxBroadband Test</title>
</head>
<body>

<h2>Login Test</h2>

<input type="text" id="loginid" placeholder="Login ID"><br><br>

<input type="password" id="password" placeholder="Password"><br><br>

<button onclick="login()">Login</button>

<hr>

<pre id="result"></pre>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzWi2x4UZiRpmOGsx5fCsBOaH9tG3mG81Mv1aFG2BUrvxnAa3AdLWZ3X69BQLiJ2ZZ1gQ/exec";

async function login() {

    const loginid = document.getElementById("loginid").value.trim();
    const password = document.getElementById("password").value.trim();

    const result = document.getElementById("result");
    result.innerHTML = "Loading...";

    try {

        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                loginid,
                password
            })
        });

        const data = await response.json();

        if (data.success) {

            result.innerHTML =
`Customer Name : ${data.data["Customer Name"]}
Customer ID   : ${data.data["Customer ID"]}
Contact No    : ${data.data["Contact No"]}
Mail ID       : ${data.data["Mail ID"]}`;

        } else {

            result.innerHTML = data.message;

        }

    } catch (err) {

        result.innerHTML = err;

    }

}

</script>

</body>
</html>
