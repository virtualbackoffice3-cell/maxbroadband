<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0a63ff">
    <title>MaxBroadband Offline</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 24px;
            color: #101828;
            background: linear-gradient(145deg, #eaf1ff, #f8fbff);
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        }

        main {
            width: min(100%, 390px);
            padding: 28px;
            background: #fff;
            border: 1px solid #e5eaf2;
            border-radius: 24px;
            box-shadow: 0 18px 45px rgba(13, 45, 101, .14);
            text-align: center;
        }

        .mark {
            display: grid;
            place-items: center;
            width: 70px;
            height: 70px;
            margin: 0 auto 18px;
            color: #fff;
            background: linear-gradient(145deg, #0a63ff, #003487);
            border-radius: 22px;
            font-weight: 900;
        }

        h1 {
            margin-bottom: 8px;
            font-size: 28px;
        }

        p {
            color: #667085;
            line-height: 1.55;
        }

        a {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            min-height: 50px;
            margin-top: 22px;
            padding: 0 20px;
            color: #fff;
            background: #0a63ff;
            border-radius: 16px;
            font-weight: 900;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main>
        <div class="mark">MB</div>
        <h1>You are offline</h1>
        <p>MaxBroadband needs an internet connection to verify your account and refresh plan details.</p>
        <a href="index.html">Try Again</a>
    </main>
</body>
</html>
